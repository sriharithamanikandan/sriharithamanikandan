<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#3b1f6b"/>
      <stop offset="1" stop-color="#6b2150"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#g)"/>

  <circle cx="80" cy="40" r="2.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="150" r="2" fill="#c4a5ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="30" r="3" fill="#f472b6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="165" r="2.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="45" r="2" fill="#c4a5ff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="140" r="3" fill="#f472b6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="20" r="2" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></circle>

  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">
    Sri Haritha Manikandan
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>
  <text x="450" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e9ddf9">
    Third-year CSE Student
    <animate attributeName="opacity" values="0;1" dur="3s" fill="freeze"/>
  </text>
</svg>
